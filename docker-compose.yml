services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      Ao3HttpClient__OperatorContact: ${AO3_OPERATOR_CONTACT:?Set AO3_OPERATOR_CONTACT in .env — an email or URL AO3 can reach you at}
      Ao3HttpClient__MinDelayBetweenRequests: ${AO3_MIN_DELAY:-00:00:05}
      Ao3HttpClient__MaxDelayBetweenRequests: ${AO3_MAX_DELAY:-00:00:08}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Holds the SQLite database, the Data Protection key ring, and the admin-editable
      # settings.json overlay. This one volume is all that needs to survive a
      # container recreate for the whole instance (data + secrets) to be durable.
      - app-data:/app/data

volumes:
  app-data:
